  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.addEventListener('error', function(e) {
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true;
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {};
    const pendingRelays = {};
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return;
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

=\"João Gustavo Consultoria Empresarial Food Service\" style=\"width: 100%; max-width: 200px; height: auto; display: block\">\n    <div style=\"font-size: 12px; color: #9fb2c9\">Controle de Estoque &amp; CMV<\u002Fdiv>\n  <\u002Fdiv>\n  <sc-for list=\"{{groups}}\" as=\"g\" hint-placeholder-count=\"5\">\n    <div class=\"grp\">\n      <div class=\"grp-l\">{{g.label}}<\u002Fdiv>\n      <sc-for list=\"{{g.items}}\" as=\"it\" hint-placeholder-count=\"3\">\n        <button class=\"{{it.cls}}\" sc-camel-on-click=\"{{it.go}}\"><span class=\"dot\"><\u002Fspan>{{it.label}}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n  <div style=\"margin-top: auto; padding: 14px 10px 0; border-top: 1px solid #1d3352; display: flex; flex-direction: column; gap: 8px\">\n    <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #8ea0b6; text-transform: uppercase\">Método desenvolvido por<\u002Fdiv>\n    <img src=\"14b40702-0ea1-4407-bd2d-31a7ea5c09f5\" alt=\"João Gustavo Consultoria Empresarial Food Service\" style=\"width: 150px; height: auto; display: block; opacity: 0.9\">\n    <div style=\"font-size: 11px; color: #8ea0b6; line-height: 1.5\">Versão V12.1 · {{saveInfo}}<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<main class=\"main\">\n  <div class=\"top\">\n    <div style=\"display: flex; align-items: center; gap: 14px; flex-wrap: wrap\">\n      <div style=\"font-weight: 800; font-size: 15px\">{{cfg.nome}}<\u002Fdiv>\n      <span class=\"pill mute\">Mês de referência: {{cfg.mes}}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 12px; color: #475569; font-weight: 700\">\n      <span><span class=\"sw\" style=\"background: #e8f1fb\"><\u002Fspan>Você preenche<\u002Fspan>\n      <span><span class=\"sw\" style=\"background: #ffffff; border-color: #c3ccd8\"><\u002Fspan>Automático<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===================== COMO USAR ===================== -->\n  <sc-if value=\"{{is.como}}\" hint-placeholder-val=\"{{ true }}\">\n  <div class=\"page\">\n    <div>\n      <div class=\"eyebrow\">JG Consultoria · Versão V12.1<\u002Fdiv>\n      <h1 class=\"h1\">Controle de Estoque &amp; CMV<\u002Fh1>\n    <\u002Fdiv>\n    <div class=\"grid2\">\n      <div class=\"card\">\n        <h2 class=\"h2\">Dados da empresa e do mês<\u002Fh2>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; align-items: end\">\n          <label class=\"fld\" style=\"grid-column: span 2\">Nome do restaurante<input class=\"inp\" style=\"min-height: 44px\" value=\"{{cfg.nomeStr}}\" sc-camel-on-change=\"{{cfg.onNome}}\" placeholder=\"Nome que sai no topo e nas impressões\"><\u002Flabel>\n          <label class=\"fld\">Mês de referência<input class=\"inp\" style=\"min-height: 44px\" value=\"{{cfg.mesStr}}\" sc-camel-on-change=\"{{cfg.onMes}}\" placeholder=\"Ex.: Outubro 2026\"><\u002Flabel>\n          <label class=\"fld\">Meta de CMV do mês<input class=\"inp\" style=\"min-height: 44px\" value=\"{{cfg.metaMesStr}}\" sc-camel-on-change=\"{{cfg.onMeta}}\" placeholder=\"35%\"><\u002Flabel>\n        <\u002Fdiv>\n        <p class=\"sub\" style=\"font-size: 12px\">A meta de cada semana fica no CMV da semana; a do CMC fica na tela CMC compras.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h2 class=\"h2\">Seus dados<\u002Fh2>\n        <div class=\"cream\"><b>{{dados.info}}.<\u002Fb> Tudo o que é digitado fica gravado sozinho neste computador e neste navegador. Baixe um backup de vez em quando e sempre antes de trocar de computador ou limpar o navegador.<\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px\">\n          <button class=\"btn\" sc-camel-on-click=\"{{dados.backup}}\">Baixar backup<\u002Fbutton>\n          <label class=\"btn sec\" style=\"position: relative\">Restaurar backup<input type=\"file\" accept=\".json,application/json\" sc-camel-on-change=\"{{dados.restaurar}}\" aria-label=\"Escolher arquivo de backup\" style=\"position: absolute; width: 1px; height: 1px; opacity: 0\"><\u002Flabel>\n          <button class=\"btn sec\" sc-camel-on-click=\"{{dados.novoMes}}\">Iniciar novo mês<\u002Fbutton>\n        <\u002Fdiv>\n        <p class=\"sub\" style=\"font-size: 12px\">Dados iniciais importados de: {{dados.origem}} · <button class=\"lnk\" style=\"color: #8f1d1d; font-size: 12px\" sc-camel-on-click=\"{{dados.zerar}}\">voltar aos dados da planilha<\u002Fbutton><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <h2 class=\"h2\">Como usar este sistema<\u002Fh2>\n      <sc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"13\">\n        <div class=\"step\">\n          <div class=\"stepn\">{{s.n}}<\u002Fdiv>\n          <div style=\"font-weight: 800; font-size: 13px\">{{s.t}}<\u002Fdiv>\n          <div style=\"font-size: 13px; color: #475569; line-height: 1.5\">{{s.d}}<\u002Fdiv>\n          <button class=\"lnk\" sc-camel-on-click=\"{{s.go}}\">Abrir<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <h2 class=\"h2\">Legenda<\u002Fh2>\n      <div class=\"mini\" style=\"max-width: 760px\">\n        <div><span class=\"sw\" style=\"background: #e8f1fb\"><\u002Fspan><b>Campo azul-claro<\u002Fb><\u002Fdiv><div class=\"v\" style=\"font-weight: 600\">Você preenche<\u002Fdiv>\n        <div><span class=\"sw\" style=\"background: #ffffff; border-color: #c3ccd8\"><\u002Fspan><b>Campo branco / cinza<\u002Fb><\u002Fdiv><div class=\"v\" style=\"font-weight: 600\">Calculado automaticamente. Não dá para digitar por cima.<\u002Fdiv>\n        <div><b>Unidades kg e L<\u002Fb><\u002Fdiv><div class=\"v\" style=\"font-weight: 600; white-space: normal\">Nas fichas técnicas, a quantidade usada é em gramas / ml (o sistema converte). Em und, cx e pct é por unidade.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== CADASTRO ===================== -->\n  <sc-if value=\"{{is.cad}}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"page\">\n    <div>\n      <h1 class=\"h1\">Cadastro de insumos<\u002Fh1>\n      <p class=\"sub\">Base de preços de todo o controle<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"cream\">Preencha os campos azul-claros. Valor unit. = valor de compra ÷ quantidade que rende. O CÓD de cada linha é fixo: pode <b>renomear à vontade<\u002Fb> que todas as telas acompanham. <b>A ordem do cadastro é a ordem da Lista de contagem e do CMV<\u002Fb>: item novo entra na posição que você escolher (ou use ↑ ↓) e tudo o que já foi lançado continua com o seu item, porque fica preso ao CÓD, não à linha. <b>NA CONTAGEM? = Não<\u002Fb> tira o item da lista de contagem (no CMV ele continua, no fim da tabela). Item que já tem lançamento não pode ser excluído: renomeie para \"(INATIVO) ...\".<\u002Fdiv>\n\n    <div class=\"card\">\n      <h2 class=\"h2\">Novo insumo<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end\">\n        <label class=\"fld\" style=\"grid-column: span 2\">Produto<input class=\"inp\" style=\"min-height: 44px\" value=\"{{novo.nome}}\" sc-camel-on-change=\"{{novo.onNome}}\" placeholder=\"Nome do insumo\"><\u002Flabel>\n        <label class=\"fld\">Unid<sc-raw-select class=\"inp\" value=\"{{novo.un}}\" sc-camel-on-change=\"{{novo.onUn}}\"><sc-for list=\"{{unOpts}}\" as=\"u\" hint-placeholder-count=\"7\"><option value=\"{{u.v}}\">{{u.v}}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n        <label class=\"fld\">Qtd que rende<input class=\"inp\" style=\"min-height: 44px\" value=\"{{novo.rende}}\" sc-camel-on-change=\"{{novo.onRende}}\"><\u002Flabel>\n        <label class=\"fld\">Valor de compra<input class=\"inp\" style=\"min-height: 44px\" value=\"{{novo.compra}}\" sc-camel-on-change=\"{{novo.onCompra}}\" placeholder=\"R$\"><\u002Flabel>\n        <label class=\"fld\">Categoria<sc-raw-select class=\"inp\" value=\"{{novo.cat}}\" sc-camel-on-change=\"{{novo.onCat}}\"><sc-for list=\"{{catNames}}\" as=\"c\" hint-placeholder-count=\"6\"><option value=\"{{c.nome}}\">{{c.nome}}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n        <label class=\"fld\" style=\"grid-column: span 2\">Posição na contagem e no CMV<sc-raw-select class=\"inp\" value=\"{{novo.after}}\" sc-camel-on-change=\"{{novo.onAfter}}\"><option value=\"\">No fim da lista<\u002Foption><option value=\"__top\">No topo da lista<\u002Foption><sc-for list=\"{{posOpts}}\" as=\"o\" hint-placeholder-count=\"10\"><option value=\"{{o.v}}\">Depois de {{o.label}}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n        <button class=\"btn\" sc-camel-on-click=\"{{novo.add}}\">Cadastrar insumo<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{novo.hasMsg}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"sub\" style=\"color: #16324f; font-weight: 700\">{{novo.msg}}<\u002Fp><\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start\">\n      <div style=\"flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n        <div class=\"chips\" role=\"group\" aria-label=\"Filtrar por categoria\">\n          <sc-for list=\"{{catChips}}\" as=\"c\" hint-placeholder-count=\"7\">\n            <button class=\"{{c.cls}}\" sc-camel-on-click=\"{{c.pick}}\">{{c.nome}}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"tblw tall\">\n          <sc-raw-table>\n            <sc-raw-thead><sc-raw-tr><sc-raw-th>Ordem<\u002Fsc-raw-th><sc-raw-th>CÓD<\u002Fsc-raw-th><sc-raw-th class=\"fill\">Produto<\u002Fsc-raw-th><sc-raw-th class=\"fill\">Unid<\u002Fsc-raw-th><sc-raw-th class=\"r fill\">Qtd que rende<\u002Fsc-raw-th><sc-raw-th class=\"r fill\">Valor de compra<\u002Fsc-raw-th><sc-raw-th class=\"r\">Valor unit. (pós-rendimento)<\u002Fsc-raw-th><sc-raw-th class=\"fill\">Categoria<\u002Fsc-raw-th><sc-raw-th>Entra no CMV?<\u002Fsc-raw-th><sc-raw-th class=\"fill\">Na contagem?<\u002Fsc-raw-th><sc-raw-th><\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{cadRows}}\" as=\"r\" hint-placeholder-count=\"12\">\n                <sc-raw-tr>\n                  <sc-raw-td><div style=\"display: flex; gap: 4px; align-items: center\"><span style=\"width: 24px; font-weight: 800; color: #5b6676\">{{r.pos}}<\u002Fspan><button class=\"ordb\" sc-camel-on-click=\"{{r.up}}\" aria-label=\"Subir {{r.nome}}\">↑<\u002Fbutton><button class=\"ordb\" sc-camel-on-click=\"{{r.down}}\" aria-label=\"Descer {{r.nome}}\">↓<\u002Fbutton><\u002Fdiv><\u002Fsc-raw-td>\n                  <sc-raw-td class=\"code\">{{r.cod}}<\u002Fsc-raw-td>\n                  <sc-raw-td><input class=\"inp wide\" value=\"{{r.nome}}\" sc-camel-on-change=\"{{r.onNome}}\" aria-label=\"Produto {{r.cod}}\"><\u002Fsc-raw-td>\n                  <sc-raw-td><sc-raw-select class=\"inp\" style=\"width: 76px\" value=\"{{r.un}}\" sc-camel-on-change=\"{{r.onUn}}\" aria-label=\"Unidade {{r.cod}}\"><sc-for list=\"{{unOpts}}\" as=\"u\" hint-placeholder-count=\"7\"><option value=\"{{u.v}}\">{{u.v}}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fsc-raw-td>\n                  <sc-raw-td class=\"r\"><input class=\"inp num\" value=\"{{r.rende}}\" sc-camel-on-change=\"{{r.onRende}}\" aria-label=\"Quantidade que rende {{r.cod}}\"><\u002Fsc-raw-td>\n                  <sc-raw-td class=\"r\"><input class=\"inp num\" value=\"{{r.compra}}\" sc-camel-on-change=\"{{r.onCompra}}\" placeholder=\"R$\" aria-label=\"Valor de compra {{r.cod}}\"><\u002Fsc-raw-td>\n                  <sc-raw-td class=\"{{r.unitCls}}\">{{r.unitTxt}}<\u002Fsc-raw-td>\n                  <sc-raw-td><sc-raw-select class=\"inp\" style=\"min-width: 140px\" value=\"{{r.cat}}\" sc-camel-on-change=\"{{ 2Fsc-if>\n\n  <!-- ===================== ESTOQUE MÍNIMO ===================== -->\n  <sc-if value=\"{{is.est}}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"page\">\n    <div class=\"row\">\n      <div>\n        <h1 class=\"h1\">Estoque mínimo<\u002Fh1>\n        <p class=\"sub\">Calculado pela média de uso das semanas fechadas<\u002Fp>\n      <\u002Fdiv>\n      <button class=\"btn\" sc-camel-on-click=\"{{openCompras}}\">Gerar lista de compras<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 14px\">\n      <div class=\"card\" style=\"flex: 1 1 300px\">\n        <h2 class=\"h2\">Parâmetros<\u002Fh2>\n        <div style=\"display: grid; grid-template-columns: 1fr 90px; gap: 8px; align-items: center; font-size: 13px\">\n          <span>Dias de operação na semana<\u002Fspan><input class=\"inp num\" value=\"{{est.dias}}\" sc-camel-on-change=\"{{est.onDias}}\" aria-label=\"Dias de operação\">\n          <span>Prazo de reposição padrão (dias)<\u002Fspan><input class=\"inp num\" value=\"{{est.prazo}}\" sc-camel-on-change=\"{{est.onPrazo}}\" aria-label=\"Prazo de reposição\">\n          <span>Margem de segurança<\u002Fspan><input class=\"inp num\" value=\"{{est.margem}}\" sc-camel-on-change=\"{{est.onMargem}}\" aria-label=\"Margem\">\n          <span>Cobertura do estoque ideal (dias)<\u002Fspan><input class=\"inp num\" value=\"{{est.cob}}\" sc-camel-on-change=\"{{est.onCob}}\" aria-label=\"Cobertura\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"flex: 1 1 300px\">\n        <h2 class=\"h2\">Semanas fechadas (entram na média)<\u002Fh2>\n        <div style=\"display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; text-align: center; font-size: 12px; font-weight: 800\">\n          <sc-for list=\"{{weeks}}\" as=\"w\" hint-placeholder-count=\"5\"><div style=\"display: flex; flex-direction: column; gap: 6px\"><span style=\"color: #5b6676\">{{w.short}}<\u002Fspan><span class=\"{{w.fechCls
